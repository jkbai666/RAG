name: rag-mvp
services:
  mysql:
    image: mysql:8.4.9
    environment:
      MYSQL_DATABASE: rag_mvp
      MYSQL_USER: rag
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .local/app.env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .local/app.env}
    ports:
      - "127.0.0.1:13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  chroma:
    image: chromadb/chroma:1.5.9
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - chroma-data:/data
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /data
      ANONYMIZED_TELEMETRY: "FALSE"
    restart: unless-stopped
volumes:
  mysql-data:
  chroma-data:
